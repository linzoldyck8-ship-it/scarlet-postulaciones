<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Postulaciones - Scarlet Esports</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="top-nav">
        <div class="logo">🔥 SCARLET ESPORTS</div>
        <nav>
            <a href="/">Inicio</a>
            <a href="/postulaciones" style="color: #ff4655;">Postulaciones</a>
        </nav>
    </header>

    <div class="container" style="max-width: 650px; margin: 40px auto; padding: 0 15px;">
        <div class="form-card">
            <h1 style="font-size: 1.8rem; text-align: center; margin-bottom: 10px;">🏆 Postulación de Roster</h1>
            <p style="text-align: center; color: #a0a0b0; margin-bottom: 25px; font-size: 0.9rem;">
                Demuestra tu talento y forma parte de nuestra alineación oficial.
            </p>

            <form id="form-postular">
                <div style="margin-bottom: 15px;">
                    <label><b>Selecciona la División:</b></label>
                    <select id="division" name="division" onchange="cambiarFondoJuego(this.value)">
                        <option value="valorant">Valorant</option>
                        <option value="overwatch">Overwatch</option>
                        <option value="cs">Counter-Strike (CS)</option>
                        <option value="valorant_femenino">Valorant Femenino</option>
                        <option value="fighting">Fighting Games</option>
                    </select>
                </div>

                <div style="margin-bottom: 15px;">
                    <label><b>ID de Jugador (Riot ID / Steam / BattleTag):</b></label>
                    <input type="text" id="player_id" name="player_id" placeholder="Ej: ScarletPlayer#LAN" required>
                </div>

                <div style="margin-bottom: 15px;">
                    <label><b>Contacto (Discord / WhatsApp / Email):</b></label>
                    <input type="text" id="contacto" name="contacto" placeholder="Ej: discord_user#1234" required>
                </div>

                <div style="margin-bottom: 15px;">
                    <label><b>Edad:</b></label>
                    <input type="number" id="edad" name="edad" placeholder="18" min="12" max="99" required>
                </div>

                <div style="margin-bottom: 15px;">
                    <label><b>Rol Principal:</b></label>
                    <input type="text" id="rol" name="rol" placeholder="Ej: Duelista / Support / Entry">
                </div>

                <div style="margin-bottom: 15px;">
                    <label><b>Rango Actual:</b></label>
                    <input type="text" id="rango_actual" name="rango_actual" placeholder="Ej: Inmortal 2 / Gran Maestro">
                </div>

                <div style="margin-bottom: 15px;">
                    <label><b>Peak Elo (Rango Máximo Alcanzado):</b></label>
                    <input type="text" id="peak_elo" name="peak_elo" placeholder="Ej: Radiante / Top 500">
                </div>

                <div style="margin-bottom: 20px;">
                    <label><b>¿Has tenido baneos previos o sanciones?:</b></label>
                    <input type="text" id="baneos" name="baneos" placeholder="Indica 'Limpio' o detalla la razón">
                </div>
