    <header class="top-nav">Código JavaScript necesario para renderizar y actualizar dinámicamente el **Control de Convocatorias** y la tabla de **Aspirantes / Postulaciones** según la división seleccionada:

```html
<script>
document.addEventListener('DOMContentLoaded', () => {
  const selectDivision = document.querySelector('select'); // O usa document.getElementById('tu-id-select')
  const cardConvocatorias = document.querySelectorAll('.card, div[class*="bg-"], div')[0]; // Contenedor de Control de Convocatorias
  const cardPostulaciones = document.querySelectorAll('.card, div[class*="bg-"], div')[1]; // Segundo contenedor vacío

  // Función para renderizar el contenido dinámico
  async function cargarDatosDivision(division) {
    // 1. Estructura y estado para "Control de Convocatorias"
    const contenedorConvocatorias = document.querySelector('#contenedor-convocatorias') || document.querySelector('.card:first-of-type');
    if (contenedorConvocatorias) {
      contenedorConvocatorias.innerHTML = `
        <div class="p-3">
          <h5 class="mb-3">🚦 Control de Convocatorias (${division})</h5>
          <div class="d-flex align-items-center justify-content-between bg-dark p-3 rounded border border-secondary">
            <div>
              <p class="m-0 fw-bold">Estado de postulación:</p>
              <small class="text-muted">Permite o bloquea el envío de nuevos formularios</small>
            </div>
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" id="switchConvocatoria" checked>
              <label class="form-check-label text-success fw-bold" id="labelEstado">Abiertas</label>
            </div>
          </div>
        </div>
      `;

      // Event listener para el switch de convocatorias
      const switchBtn = document.getElementById('switchConvocatoria');
      const labelEstado = document.getElementById('labelEstado');
      if (switchBtn) {
        switchBtn.addEventListener('change', (e) => {
          if (e.target.checked) {
            labelEstado.textContent = 'Abiertas';
            labelEstado.className = 'form-check-label text-success fw-bold';
          } else {
            labelEstado.textContent = 'Cerradas';
            labelEstado.className = 'form-check-label text-danger fw-bold';
          }
        });
      }
    }

    // 2. Estructura y tabla para la sección de Postulaciones / Rosters
    const contenedorPostulaciones = document.querySelector('#contenedor-postulaciones') || document.querySelectorAll('.card')[1];
    if (contenedorPostulaciones) {
      contenedorPostulaciones.innerHTML = `
        <div class="p-3">
          <h5 class="mb-3">📋 Aspirantes y Postulados - ${division}</h5>
          <div class="table-responsive">
            <table class="table table-dark table-hover align-middle">
              <thead>
                <tr>
                  <th>Usuario</th>
                  <th>Rol / Rango</th>
                  <th>Fecha</th>
                  <th>Estado</th>
                  <th class="text-end">Acciones</th>
                </tr>
              </thead>
              <tbody id="tablaAspirantes">
                <tr>
                  <td colspan="5" class="text-center text-muted py-3">Cargando postulaciones de ${division}...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      `;

      // Simulación o petición a backend (fetch API)
      obtenerAspirantesBackend(division);
    }
  }

  // Petición de datos (reemplazar la URL por tu API o base de datos)
  async function obtenerAspirantesBackend(division) {
    const tabla = document.getElementById('tablaAspirantes');
    
    try {
      /* 
      // Ejemplo de conexión real:
      const response = await fetch(`/api/postulaciones?division=${division}`);
      const data = await response.json();
      */

      // Datos de prueba para previsualización
      setTimeout(() => {
        tabla.innerHTML = `
          <tr>
            <td><strong>PlayerOne#1234</strong></td>
            <td>Radiant / Duelista</td>
            <td>22/09/2026</td>
            <td><span class="badge bg-warning text-dark">Pendiente</span></td>
            <td class="text-end">
              <button class="btn btn-sm btn-outline-success">Aceptar</button>
              <button class="btn btn-sm btn-outline-danger">Rechazar</button>
            </td>
          </tr>
        `;
      }, 400);

    } catch (error) {
      tabla.innerHTML = `<tr><td colspan="5" class="text-center text-danger">Error al cargar datos.</td></tr>`;
    }
  }

  // Listener para el selector de división
  if (selectDivision) {
    selectDivision.addEventListener('change', (e) => {
      cargarDatosDivision(e.target.value);
    });

    // Carga inicial según el valor por defecto
    cargarDatosDivision(selectDivision.value);
  }
});
</script>
